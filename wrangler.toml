# Cloudflare Pages project configuration.
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "edge-blog"
compatibility_date = "2026-11-8"
compatibility_flags = ["nodejs_compat"]

# Where Vite emits the static build. Pages serves this directory.
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Bindings
# Run the `wrangler` setup commands in README.md, then paste the real IDs here.
# ---------------------------------------------------------------------------

# D1 — relational data (posts, comments, settings, ...)
[[d1_databases]]
binding = "DB"
database_name = "edge-blog"
database_id = "1b2aacfe-01a4-4589-ad14-c7f5a7a970ea"

# R2 — media library / image uploads
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "edge-blog-media"

# KV — config cache + rate limiting counters
[[kv_namespaces]]
binding = "CACHE"
id = "c8705ddb0444492c88748efc5a86aaf4"

# ---------------------------------------------------------------------------
# Non-secret variables. SECRETS (JWT_SECRET, ...) must be set via
# `wrangler pages secret put` or the dashboard, never committed.
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
# 站点对外地址：用于 canonical / RSS / sitemap / OG。绑定自定义域名后改成自己的域名。
SITE_URL = "https://www.068800.xyz"
# 上传图片的公开前缀，**默认留空**：图片以相对路径 /media/<key> 保存，
# 链接自动跟随访问域名（换域名、绑自定义域名都无需改数据）。
# 仅当把 R2 桶绑定了独立的自定义域名（例如 https://media.example.com）时才需要设置。
# MEDIA_PUBLIC_BASE = "https://media.example.com"
# Cookie name for the admin session.
SESSION_COOKIE = "eb_session"
# Comma separated list of extra origins allowed to make credentialed CORS
# requests. Same-origin requests are always allowed; "*" is ignored on purpose
# (a wildcard plus credentials is unsafe). SITE_URL is included automatically.
ALLOWED_ORIGINS = "https://www.068800.xyz"
